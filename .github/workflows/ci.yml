name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run test suite
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build scoring API image
        run: docker build -t pesaguard-api .

      - name: Boot container and verify /health
        run: |
          docker run -d --name pesaguard -p 8000:8000 pesaguard-api
          for i in $(seq 1 45); do
            if curl --silent --fail http://localhost:8000/health; then
              echo "API healthy after ~$((i * 2))s"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' pesaguard)" != "true" ]; then
              echo "Container exited during boot" >&2
              docker logs pesaguard >&2
              exit 1
            fi
            sleep 2
          done
          echo "API failed to become healthy in time" >&2
          docker logs pesaguard >&2
          exit 1
