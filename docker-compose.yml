services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Falls back to local SQLite inside the container when unset
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:-}
    volumes:
      - pesaguard-data:/app/data

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

volumes:
  pesaguard-data:
